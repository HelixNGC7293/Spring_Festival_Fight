    <meta charset="UTF-8" />

    <title>春节渡劫模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap');
      
      body {
        font-family: 'Noto Sans SC', sans-serif;
        background-color: #2b0a0a; /* Dark festive red */
        color: #fef2f2;
      }
      
      .font-pixel {
        font-family: 'Press Start 2P', cursive;
      }
      
      .font-happy {
        font-family: 'ZCOOL KuaiLe', cursive;
      }

      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      .pixelated {
        image-rendering: pixelated;
      }
      
      /* CRT Scanline effect overlay (optional, subtle) */
      .scanlines::before {
        content: " ";
        display: block;
        position: absolute; 
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 50;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
    </style>
